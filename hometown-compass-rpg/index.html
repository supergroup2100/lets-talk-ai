<style>

ranslateY(-8px)}}@media(max-width:620px){.wrap{padding:12px}.progressrow{grid-template-columns:1fr}.statrow{justify-content:space-between}.hero{min-height:220px}.heroIcon{font-size:54px}.card{padding:17px}.choices{grid-template-columns:1fr}.actions{flex-wrap:wrap}.tip{order:3;flex-basis:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body><div class="backdrop"></div><main class="wrap">
<header class="top"><div class="logo">✦ 家鄉探險者公會</div><div class="tools"><button class="btn" id="sound">♫ 音效：關</button><button class="btn" id="full">⛶ 全螢幕</button></div></header>
<section class="progressrow"><div><div class="goal" id="goal">主線任務：修復家鄉時光羅盤，找回五枚探索徽章</div><div class="track"><div class="fill" id="fill"></div></div></div><div class="statrow"><div class="stat">✦ 經驗 <b id="xp">0</b></div><div class="stat">區域 <b id="zone">序章</b></div></div></section>
<section class="hero"><div class="heroContent"><div class="heroIcon" id="heroIcon">🧭</div><h1 id="heroTitle">家鄉時光羅盤</h1><p id="heroDesc">穿越地圖與歲月，探索家鄉的自然和生活智慧</p><div class="mapline" id="mapline"></div></div></section>
<section class="card intro" id="intro"><div class="kicker">一封來自家鄉守護者的信</div><p>時光羅盤的五枚徽章散落在家鄉各處。地圖公會、地形稜線、風雨水脈、古厝聚落與器物工坊，都留下了線索。請跟著嚮導「小禾」出發，運用觀察、比較和推理，讓羅盤重新指向家鄉。</p><p>每區有 5 道任務。答對可獲得經驗值；答錯會看到提示與解說，可以重試。遊戲進度會儲存在目前瀏覽器，換裝置不會自動同步。</p><button class="primary" id="start">⚔ 開始探險</button> <button class="btn hidden" id="resume">繼續上次進度</button> <button class="btn hidden" id="reset">清除存檔</button></section>

<section class="card finish hidden" id="finish"></section>
<footer class="foot">依據國小社會 4 上課本第 1、2 單元設計｜遊戲資料只存在此瀏覽器</footer>
</main><script>

{name:'地形稜線',icon:'⛰️',desc:'從高低起伏讀出居民生活的線索',badge:'地形徽章',title:'第二區・地形稜線'},
{name:'風雨水脈',icon:'🌦️',desc:'觀察氣候與水資源，安排一趟安心旅程',badge:'水脈徽章',title:'第三區・風雨水脈'},

const questions=[
{z:0,q:'你想知道家鄉包含哪些行政區，最適合查閱哪一種地圖？',a:['行政區圖','地形圖','交通路線圖','衛星影像圖'],c:0,h:'想找的是行政區的範圍與名稱。',e:'行政區圖能呈現縣市或鄉鎮市區等行政範圍。'},
{z:0,q:'地圖上的「方向標」主要可以幫助我們？',a:['辨認地圖上的方位','知道實際距離','認出圖上的景物符號','得知地圖主題'],c:0,h:'它會標示北、南、東、西。',e:'方向標表示方位；比例尺表示縮小程度；圖例說明符號；圖名說明地圖主題。'},
{z:0,q:'地圖上標出「比例尺：1 公分代表 100 公尺」，這是要告訴我們什麼？',a:['地圖距離與實際距離的關係','道路的名稱','景物符號代表什麼','地圖朝向哪個方向'],c:0,h:'它比較圖上的長度和真實世界的長度。',e:'比例尺表示實際距離在地圖上被縮小的程度。'},
{z:0,q:'想規畫從學校到博物館的路線，應優先使用哪種地圖？',a:['交通路線圖','地形圖','行政區圖','氣溫圖'],c:0,h:'要找道路、鐵路或捷運路線。',e:'交通路線圖能幫助認識主要道路與交通路線。'},
{z:0,q:'使用電子地圖時，輸入地點名稱並縮放畫面，主要可以？',a:['搜尋位置並調整觀看範圍','直接改變當地地形','測出全年平均雨量','自動決定戶外教育日期'],c:0,h:'試想手機地圖常見的搜尋和放大縮小功能。',e:'電子地圖可搜尋地點，也能縮放範圍、切換不同呈現模式，例如地圖或衛星模式。'},

{z:1,q:'四周較高、中間低平的地形，稱為什麼？',a:['盆地','台地','丘陵','平原'],c:0,h:'想像像碗一樣被周圍高地圍住。',e:'盆地的特徵是四周較高、中間低平。'},
{z:1,q:'頂部平坦，邊緣以陡坡和低地相接的地形是？',a:['台地','山地','盆地','平原'],c:0,h:'名字有「台」，像較高的平臺。',e:'台地頂部平坦，邊緣常以陡坡和較低的地面相接。'},

{z:1,q:'丘陵或山地坡度較緩的地方，居民可能發展哪種生活？',a:['開闢茶園、果園或種植水果','興建大面積魚塭於高山頂','建造大型機場於陡坡','只發展海上捕魚'],c:0,h:'課本提到山坡地排水和氣候條件可適合某些作物。',e:'丘陵、山地活動受地形限制，居民常選擇坡度較緩處開闢茶園、果園或種植水果。'},
{z:2,q:'「氣候」是指什麼？',a:['一個地區長時間的天氣平均狀況','某一天早上的天氣','一場午後雷雨','每天的風向而已'],c:0,h:'和長時間的平均狀況有關。',e:'氣候是某地區長時間的天氣平均狀況，可從氣溫和雨量等資料認識。'},
{z:2,q:'想比較家鄉一年中各月的冷熱變化，最適合查看？',a:['各月平均氣溫圖','交通路線圖','行政區圖','地形圖'],c:0,h:'找呈現每月溫度的圖表。',e:'氣溫圖呈現不同月份的平均氣溫，可比較季節冷熱變化。'},
{z:2,q:'澎湖雨量較少，居民選擇種植較耐旱的花生，這說明？',a:['氣候會影響居民選擇作物','地圖比例尺決定作物種類','地形和生活完全無關','水資源不需要珍惜'],c:0,h:'想想作物需要的水和當地降雨有沒有關係。',e:'居民會依據氣候條件選擇適合的作物與生活方式。'},
{z:2,q:'下列哪一組都是家鄉重要的水資源？',a:['河川、湖泊、地下水、海洋','道路、橋梁、捷運、隧道','雨衣、雨傘、水壺、雨鞋','平原、盆地、台地、丘陵'],c:0,h:'想想自然環境中可以提供用水或水域活動的地方。',e:'河川、湖泊、地下水與海洋都是家鄉重要的水資源。'},
{z:2,q:'水庫可能有哪些功能？',a:['供給民生與工業用水、灌溉或水力發電','製造地震和颱風','辨認地圖方向','取代所有河川'],c:0,h:'想想水庫如何儲水，以及水可以如何被利用。',e:'水庫可供應民生、工業用水，也可灌溉或用於水力發電。'},
{z:3,q:'原住民族使用石板、木頭、竹子等當地材料蓋住屋，呈現什麼智慧？',a:['就地取材並適應自然環境','所有住屋都要使用塑膠','建築和環境沒有關係','只能模仿外國建築'],c:0,h:'「就地取材」就是使用周遭容易取得的材料。',e:'傳統住屋常使用當地材料，並依環境發展合適的建築形式。'},
{z:3,q:'排灣族石板屋厚實的石板有助於什麼？',a:['冬暖夏涼','讓屋頂能收集彩虹','讓房子浮在水上','讓室內永遠不需通風'],c:0,h:'石板厚，有隔熱、保暖效果。',e:'厚石板有隔熱與保暖特性，石板屋因此有冬暖夏涼的效果。'},
{z:3,q:'雅美族（達悟族）傳統半地下式住屋，主要可幫助居民？',a:['躲避強風侵襲','讓房屋遠離所有水源','增加平原面積','觀察城市交通'],c:0,h:'想想蘭嶼常遇到的自然環境條件。',e:'較低矮的半地下式住屋有助於躲避強風。'},
{z:3,q:'早期漢人使用竹子作骨架、再敷上泥土建造的住屋，稱為？',a:['竹管仔厝','石板屋','地下屋','三合院'],c:0,h:'名稱裡有建材「竹」。',e:'竹管仔厝以竹子作為建築骨架，再敷上泥土建造。'},
{z:3,q:'傳統住屋逐漸改變，部分老屋被保存或活化利用，主要有什麼價值？',a:['保存先民智慧與文化特色','讓居民不能再使用新建材','把所有聚落變成相同樣貌','避免人們認識地方歷史'],c:0,h:'保存老屋讓後代有機會認識傳統生活。',e:'維護傳統建築可保存文化與生活智慧，有些老屋也成為觀光景點或特色空間。'},
{z:4,q:'原住民族魚筌用竹子、藤編成漏斗狀，設計上讓小魚能從縫隙游出，這有什麼意義？',a:['避免小魚被捕光，讓魚群能繼續繁衍','讓魚筌變成房屋','把溪水全部攔住','讓魚只能在陸地生活'],c:0,h:'這是兼顧捕魚與魚群延續的設計。',e:'魚筌的縫隙讓小魚可以逃出，避免魚群被捕光，展現善用資源的智慧。'},
{z:4,q:'木杵、月桃葉和魚筌等傳統器物，主要反映早期居民？',a:['運用周遭自然材料滿足生活需要','完全不使用環境資源','只靠工廠大量製造','不需要工具或器物'],c:0,h:'想想這些器物分別用什麼材料製作。',e:'原住民族善用竹子、藤、木頭和植物葉子製作實用器物。'},
{z:4,q:'木柴燒完後的灰燼可以悶熟地瓜，冷卻後還能當菜園肥料，這表現了？',a:['物盡其用的生活智慧','浪費自然資源','塑膠器物的便利','電子地圖的功能'],c:0,h:'同一種材料在不同階段還能繼續利用。',e:'先民將木柴燃燒後的灰燼再利用，體現物盡其用。'},

{z:4,q:'想減少一次性塑膠吸管的使用，哪個做法較友善環境？',a:['自備可重複使用的吸管或直接不使用','每次都多拿幾支備用','用完丟在河邊','把吸管丟進海裡'],c:0,h:'選擇能重複使用、減少廢棄物的方法。',e:'響應減塑可選擇可重複使用的器物，並減少不必要的一次性用品。'}
];
const KEY='hometown-compass-rpg-v1';let idx=0,xp=0,missed=[],cleared=false,locked=false,audioOn=false,audioCtx;
const $=s=>document.querySelector(s);function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}function save(){localStorage.setItem(KEY,JSON.stringify({idx,xp,missed,cleared}))}function zoneOf(n){return n<5?0:n<10?1:n<15?2:n<20?3:4}function paintMap(active){$('#mapline').innerHTML=zones.map((z,i)=>`<span class="node ${i===active?'active':''}">${z.icon} ${z.name}</span>`).join('')}
function sync(){let z=zoneOf(idx);$('#fill').style.width=(idx/questions.length*100)+'%';$('#xp').textContent=xp;$('#zone').textContent=zones[z].name;$('#heroIcon').textContent=zones[z].icon;$('#heroTitle').textContent=zones[z].name;$('#heroDesc').textContent=zones[z].desc;$('#goal').textContent=`主線任務：修復家鄉時光羅盤　｜　第 ${Math.min(idx+1,questions.length)}／${questions.length} 題`;$('#chapter').textContent=zones[z].title;paintMap(z)}
function startGame(resume=false){let saved=load();if(resume&&saved){idx=saved.idx;xp=saved.xp;missed=saved.missed||[]}else{idx=0;xp=0;missed=[]}cleared=false;$('#intro').classList.add('hidden');$('#finish').classList.add('hidden');$('#game').classList.remove('hidden');draw()}
function draw(){if(idx>=questions.length){finish();return}locked=false;sync();let q=questions[idx];$('#question').textContent=q.q;$('#feedback').textContent='';$('#tip').textContent='';$('#next').disabled=true;$('#choices').innerHTML='';q.a.forEach((v,j)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${String.fromCharCode(65+j)}.</b> ${v}`;b.onclick=()=>answer(j,b);$('#choices').appendChild(b)});save()}
function answer(j,b){if(locked)return;let q=questions[idx];if(j===q.c){locked=true;xp+=10;b.classList.add('ok');$('#feedback').textContent='答對了！小禾：「'+q.e+'」';$('#choices').querySelectorAll('button').forEach(x=>x.disabled=true);$('#next').disabled=false;sound(620);save()}else{if(!missed.includes(idx))missed.push(idx);b.classList.add('no');$('#feedback').textContent='線索還差一點，再想想。'+q.e;sound(210);save()}}
function finish(){cleared=true;save();$('#game').classList.add('hidden');$('#finish').classList.remove('hidden');$('#fill').style.width='100%';$('#zone').textContent='完成';$('#heroIcon').textContent='🧭✨';$('#heroTitle').textContent='時光羅盤重新發光';$('#heroDesc').textContent='五枚探索徽章都回到家鄉地圖上';paintMap(-1);let rank=xp>=230?'家鄉守護者':xp>=180?'資深探索家':'見習探險家';$('#finish').innerHTML=`<div class="kicker">五枚徽章，全部收集完成！</div><div class="heroIcon">🏅</div><h2>恭喜你，${rank}！</h2><p>你完成了 5 個探索區域、${questions.length} 項任務，獲得 <b>${xp}</b> 點經驗值。${missed.length?`有 ${missed.length} 題曾需要再次思考，回顧解說後再挑戰一次吧。`:'你一路觀察仔細、推理清楚！'}</p><div class="badges">${zones.map(z=>`<span class="badge">${z.icon} ${z.badge}</span>`).join('')}</div><p class="small">探索內容：家鄉位置與地圖要素、地形及居民生活、氣候圖表與水資源、原住民族和漢人傳統住屋、生活器物與減塑。</p><button class="primary" id="again">重新探險</button>`;$('#again').onclick=()=>{localStorage.removeItem(KEY);startGame(false)}}
function sound(freq){if(!audioOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.06,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.start();o.stop(audioCtx.currentTime+.18)}catch{}}
$('#start').onclick=()=>startGame(false);$('#resume').onclick=()=>startGame(true);$('#reset').onclick=()=>{if(confirm('要清除這個瀏覽器儲存的探險進度嗎？')){localStorage.removeItem(KEY);idx=0;xp=0;missed=[];$('#resume').classList.add('hidden');$('#reset').classList.add('hidden')}};$('#next').onclick=()=>{idx++;draw()};$('#hint').onclick=()=>$('#tip').textContent=questions[idx]?.h||'';$('#sound').onclick=()=>{audioOn=!audioOn;$('#sound').textContent='♫ 音效：'+(audioOn?'開':'關');sound(500)};$('#full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};let old=load();if(old&&!old.cleared&&old.idx<questions.length){$('#resume').classList.remove('hidden');$('#reset').classList.remove('hidden')}else if(old?.cleared){$('#resume').classList.remove('hidden');$('#resume').textContent='查看已完成紀錄';$('#reset').classList.remove('hidden')}
</script></body></html>
